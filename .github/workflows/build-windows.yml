name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "onekey_change_line_v0.6.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Prepare requested source filename
        shell: pwsh
        run: Copy-Item "onekey_change_line_v0.6.py" "onekey_change_line.py" -Force

      - name: Compile EXE
        run: python -m PyInstaller -wF --clean --name "换线软件同步助手_v0.6" "onekey_change_line.py"

      - name: Upload compiled EXE
        uses: actions/upload-artifact@v4
        with:
          name: 换线软件同步助手-v0.6-Windows-EXE
          path: dist/换线软件同步助手_v0.6.exe
          if-no-files-found: error
          retention-days: 14
